# DataPact — Inspection Data Contract
# Version: 2.1
# Owner: Data Governance Team, City IT Division
# Last updated: 2025-01-10
# Status: DRAFT — pending sign-off from compliance team
# NOTE: inspection_records table contract is maintained separately (see contracts/records_contract_v1.pdf)
#       This file covers inspection_sites and inspectors only.

contract_version: "2.1"
domain: public_sector.inspections

tables:

  inspection_sites:
    description: >
      Master list of all sites registered for inspection under the municipal
      compliance framework. A site must be registered before any inspection
      can be scheduled.
    sla:
      freshness: updated within 30 days
      completeness: site_name and site_type must always be present
      row_count: expected between 5000 and 50000 rows

    fields:
      site_id:
        type: string
        nullable: false
        unique: true
        pattern: "SITE-[0-9]{5}"
        business_definition: >
          Unique identifier assigned at site registration.
          Format is SITE- followed by 5 digits. Generated by registration system.
        critical: true

      site_name:
        type: string
        nullable: false
        max_length: 200

      zone_code:
        type: string
        nullable: true   # nullable for pre-2022 legacy records only
        allowed_values: ["A", "B", "C"]
        business_definition: >
          Regulatory zone classification. Zone A = high risk, Zone B = medium,
          Zone C = low risk. Determines inspection frequency.
          NULL is acceptable only for sites created before 2022-01-01.

      site_type:
        type: string
        nullable: false
        allowed_values: ["Building", "Industrial", "Food", "Healthcare", "Utilities"]
        note: "'Utilities' was added in v2.0 - older records may not have this value"

      is_active:
        type: string
        nullable: false
        allowed_values: ["true", "false"]
        note: "Legacy string boolean. Do not change to BIT without migration plan."

      pincode:
        type: string
        nullable: true
        pattern: "[0-9]{6}"
        note: "Spaces and dashes have been found historically. Pattern rule applies to clean records only."

  inspectors:
    description: >
      Registry of all certified inspectors authorised to conduct inspections.
      An inspector must have a valid, non-expired license to be assigned inspections.
    sla:
      freshness: license_expiry must be checked weekly
      completeness: license_no and license_expiry must be present for active inspectors

    fields:
      emp_code:
        type: string
        nullable: false
        unique: true
        pattern: "EMP-[0-9]{5}"
        critical: true

      license_no:
        type: string
        nullable: false
        pattern: "LIC-[0-9]{4}-[0-9]{6}"
        business_definition: >
          Government-issued inspection license number.
          Format: LIC-YYYY-NNNNNN where YYYY is issue year.

      license_expiry:
        type: date
        nullable: false
        business_rule: must_be_future_date_for_active_inspectors
        critical: true
        note: "Some legacy records have NULL from HR system migration. Treat NULL as data gap, not expired."

      cert_level:
        type: string
        nullable: false
        allowed_values: ["L1", "L2", "L3", "SENIOR"]

      is_available:
        type: boolean
        nullable: false

      region_codes:
        type: string
        nullable: true
        business_definition: >
          Comma-separated list of zone codes the inspector is certified for.
          Valid values per zone: A, B, C. Must not contain spaces after commas.
          An inspector with NULL region_codes can be assigned to any zone.
